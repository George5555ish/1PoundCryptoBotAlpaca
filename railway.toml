# Railway service. If the git repository root is the parent folder, set
# the service root directory to crypto-bot.
#
# Paper orders after the risk gate approves them. The client still refuses
# a live Alpaca host. Run one replica only. The process also serves GET /
# on PORT for the dashboard. A dry run uses: python main.py

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python main.py --send-orders"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
